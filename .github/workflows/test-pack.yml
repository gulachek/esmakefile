name: Test released package contents

on:
  workflow_call:

jobs:
  test-released-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install example
        run: npm i
        working-directory: ./example
      - run: node testPkg.cjs
