name: Unit Tests

on:
  workflow_call:

jobs:
  run-unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Install example
        run: npm i
        working-directory: ./example
      - run: npm run build
      - run: npm run test
